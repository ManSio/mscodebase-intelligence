name: CI

on:
  push:
    branches: [main]
  pull_request:
    # main — обычные PR. Ветки миграции — «stacked» PR (основа не main):
    # без них CI не запускался, и фазы 2/3 уехали без единого зелёного прогона
    # (2026-10-10, инцидент PR #74/#75). push по-прежнему только main,
    # чтобы не задваивать прогоны для одной и той же ревизии.
    branches: [main, 'feat/**', 'exp/**', 'fix/**', 'chore/**']

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.14"]  # 3.14-only (2026-08-21): 3.10-3.13 выведены — см. requires-python

    runs-on: ${{ matrix.os }}

    steps:
      # fetch-depth: 0 — полная история: revision_gate (min_accepted_revision, TC-9)
      # проверяет ancestry через merge-base; в shallow-clone min-коммит отсутствует →
      # gate честно даёт UNKNOWN и CI падает (инцидент 2026-08-14, 38f4be7d).
      - uses: actions/checkout@v5  # P2-16 audit: v4 использует Node 20 (deprecated)
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libomp-dev  # OpenMP для onnxruntime

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          # Без openvino и lancedb GPU-зависимостей — только CPU
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src/ tests/

      - name: Client snippets cold start (G5)
        # Каждый сниппет из `install.py --print-config` запускается на чистом
        # раннере: initialize + tools/list. Покрывает все 5 клиентов, включая
        # не-Zed/не-OpenCode (generic, claude-code, cursor). Таймаут 300s: на
        # холодной машине сервер поднимает провайдеров дольше 60s (ONNX-ожидание
        # в логах), и 120s оказалось мало на windows-latest (2026-11-12).
        run: python scripts/verify_client_snippets.py --install-root "${{ github.workspace }}" --timeout 300

      - name: Layer-boundary gate (Фаза 1 Universal Engine)
        # Три оси ТЗ: ADAPTER → TRANSPORT → SOURCE → CORE. Гейт не даёт
        # mcp/tools импортировать adapters/src.sources и core — adapters.*
        # (кроме main.py dispatch); transitional core→src.sources.* обязан
        # дойти до 0 к концу Фазы 2.
        run: python scripts/check_layer_boundaries.py

      - name: Architecture invariants (architecture_linter)
        # 2026-08-24: скрипт вшит в CI — раньше гонялся только вручную.
        # pytest-guard (tests/test_architecture_invariants.py) ловит импорты,
        # но не stale-имена и циклы core-модулей.
        run: python scripts/architecture_linter.py

      - name: Check version consistency
        run: python scripts/bump_version.py --check

      - name: Disk-space guard (C:-critical 2026-09-29)
        # Fails if the runner disk has <1GB free — full disks cause
        # silent truncations in lancedb/onnx caches. Local equivalent:
        # python scripts/disk_guard.py --check
        run: python scripts/disk_guard.py --check --min-free-gb 1

      - name: Audit dependencies (pip-audit)
        # Pinned: pip-audit 2.10.1 проверен 2026-08-08 (PYSEC-2026-3552).
        # Бамп — только после локального прогона `pip-audit -r requirements-lock.txt --no-deps --disable-pip`.
        # --disable-pip + --no-deps: lock уже полностью разрешён; резолв через pip
        # в temp-venv валил CI (pywin32 — Windows-only на ubuntu, numpy 2.4.6
        # без колёс для py3.10). --no-deps обязателен с --disable-pip для не-hashed файла.
        env:
          PYTHONUTF8: "1"
        run: |
          python -m pip install "pip-audit==2.10.1"
          pip-audit -r requirements-lock.txt --no-deps --disable-pip

      - name: Full test suite (no filters)
        # -n auto (pytest-xdist): run tests on all runner cores. Measured
        # locally 197s -> 71s (x2.76, 12 cores); CI runners have 4 cores.
        # COVERAGE_RCFILE=.coveragerc.ci: the local .coveragerc sets
        # dynamic_context=test_function, which pytest-cov rejects under xdist
        # (DistCovError, pytest-cov#604) and which costs ~+13.6% (sys.settrace).
        # CI only needs the coverage % gate, so it uses the context-free config.
        env:
          COVERAGE_RCFILE: .coveragerc.ci
        run: python -m pytest tests/ -q --tb=short -m 'not slow and not benchmark' -n auto --cov=src --cov-report=term-missing --cov-fail-under=38
        timeout-minutes: 20

      # Grader mutation probe (evalmut-перенос, 2026-08-14): мутационный аудит
      # validate_scores/parse_scores_json — страж контракта градера. Дыра =
      # (вывод доказанно неверен AND градер пропустил); скрипт выходит с
      # кодом 1 при любом открытом blind spot (experiments/evalmut/probe_evalmut_transfer.py).
      # Путь обновлён после рефактора per-experiment folders (29e1365e) — старый
      # путь ломал шаг на всех платформах (файл не найден, 2026-08-16).
      - name: Grader mutation probe (evalmut guard)
        run: python experiments/evalmut/probe_evalmut_transfer.py
        timeout-minutes: 2

  clean-state:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 — см. комментарий в job test (revision_gate требует ancestry).
      - uses: actions/checkout@v5  # P2-16 audit: v4 использует Node 20 (deprecated)
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Verify clean state (no self-clone)
        run: bash scripts/verify_clean_state.sh --no-clone "${{ github.repository }}"
        # 15 min was too close: this job took 13m29s and 13m31s on two pushes
        # (others 2m10s) with a silent 743.7s gap inside the test step. Raising
        # the ceiling keeps a slow runner from turning main red; --durations=15
        # in the script names the slow tests on the next occurrence.
        timeout-minutes: 25

  secret-scan:
    # gitleaks v8.30.1 (release 2026-03-21). Архив проверяется по sha256 — тот же
    # принцип, что у osv-scanner (v2.5.1) ниже: пин версии, а не «latest».
    # Сканируются только коммиты этого PR/push: в истории уже лежит известный
    # 64-символьный MSCODEBASE_REMOTE_TOKEN (start_remote.bat, 8f694ff).
    # Удаление из кода историю не чистит; полный скан истории включается после
    # ротации токена и решения владельца о переписывании истории.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Download gitleaks v8.30.1
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSL --retry 3 --retry-delay 2 -o "$HOME/bin/gitleaks.tgz" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $HOME/bin/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$HOME/bin/gitleaks.tgz" -C "$HOME/bin" gitleaks
          "$HOME/bin/gitleaks" version
      - name: Scan commits in this change
        run: |
          BASE="${{ github.event.before }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          fi
          if [ -z "$BASE" ]; then
            BASE="HEAD~1"
          fi
          echo "scan range: $BASE..${{ github.sha }}"
          "$HOME/bin/gitleaks" git . -c .gitleaks.toml --redact \
            --log-opts="$BASE..${{ github.sha }}"
        timeout-minutes: 5

  manifest-parity:
    # B-1 (ADR-0005 scaling): наши экстракторы манифестов vs osv-scanner на корпусе
    # e-s1-polygon (Вариант В спеки 07). Выхлоп обязан совпадать (расхождение = дыра
    # в нашем парсере). Пин: osv-scanner v2.5.1 (release 2026-08-17); бамп по §5.19.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install project
        run: pip install -e .
      - name: Download osv-scanner
        run: |
          mkdir -p "$HOME/bin"
          # -f: иначе 404/HTML-страница сохраняется как «бинарь», chmod +x делает
          # её исполняемой, и паритет печатает 10 ложных расхождений
          # (инцидент CI 2026-11-08: Exec format error).
          curl -fsSL --retry 3 --retry-delay 2 -o "$HOME/bin/osv-scanner" \
            https://github.com/google/osv-scanner/releases/download/v2.5.1/osv-scanner_linux_amd64
          chmod +x "$HOME/bin/osv-scanner"
          "$HOME/bin/osv-scanner" --version
      - name: Manifest parity
        run: python scripts/manifest_parity.py --osv "$HOME/bin/osv-scanner"
        timeout-minutes: 5

  transport-equiv-e2e:
    # E-07 (DoD Фазы 3): эквивалентность stdio ↔ Streamable HTTP на РЕАЛЬНОМ движке.
    # Локально при живом основном MCP нестабилен (PID-lock embedder) — автор
    # харнесса: только чистый раннер (CI Ubuntu).
    runs-on: ubuntu-latest
    # pip install -e делает _ext_root == checkout-каталог, а CWD-first резолвит
    # его же — self-indexing guard блочит. Индексация самого себя здесь —
    # намеренный сценарий (движок в own-repo engine-режиме): явный PROJECT_PATH
    # + dev-флаг MSCODEBASE_ALLOW_SELF_INDEX=1.
    env:
      PROJECT_PATH: ${{ github.workspace }}
      MSCODEBASE_ALLOW_SELF_INDEX: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install project
        run: pip install -e .
      - name: Transport equivalence (engine mode)
        run: python experiments/universal-engine/e07_equiv.py
        timeout-minutes: 10

  docker-build:
    # DoD Фазы 3 (deploy/docker): образ из python-only remote-движка собирается
    # (локально Docker недоступен — CI-билд является верификацией).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build remote image
        run: docker build -t mscodebase-remote:ci -f deploy/docker/Dockerfile .
        timeout-minutes: 20
